<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        מערכת משלוחים - שליח
    </title>

    <link
        rel="stylesheet"
        href="driver.css?v=20261022-1"
    >

</head>


<body>


    <div class="driver-app">


        <!-- ================================================= -->
        <!-- HEADER -->
        <!-- ================================================= -->

        <header class="driver-header">

            <div>

                <p class="header-small">
                    שלום
                </p>

                <h1 id="driverName">
                    שליח
                </h1>

                <p
                    id="driverDate"
                    class="driver-date"
                >
                </p>

            </div>


            <button
                id="logoutButton"
                class="logout-button"
                type="button"
            >
                יציאה
            </button>

        </header>



        <!-- ================================================= -->
        <!-- DAILY SUMMARY -->
        <!-- ================================================= -->

        <section class="summary-grid">


            <div class="summary-card">

                <span
                    id="totalShipments"
                    class="summary-number"
                >
                    0
                </span>

                <span class="summary-label">
                    משלוחים
                </span>

            </div>


            <div class="summary-card">

                <span
                    id="deliveredShipments"
                    class="summary-number"
                >
                    0
                </span>

                <span class="summary-label">
                    נמסרו
                </span>

            </div>


            <div class="summary-card">

                <span
                    id="remainingShipments"
                    class="summary-number"
                >
                    0
                </span>

                <span class="summary-label">
                    נשארו
                </span>

            </div>


            <div class="summary-card">

                <span
                    id="failedShipments"
                    class="summary-number"
                >
                    0
                </span>

                <span class="summary-label">
                    לא נמסרו
                </span>

            </div>


        </section>



        <!-- ================================================= -->
        <!-- MAIN ACTIONS -->
        <!-- ================================================= -->

        <section class="main-actions">


            <button
                id="addShipmentButton"
                class="primary-action-button"
                type="button"
            >

                <span class="action-icon">
                    ＋
                </span>

                הוסף משלוח

            </button>


            <button
                id="toggleRoutePlannerButton"
                class="secondary-action-button"
                type="button"
            >

                <span class="action-icon">
                    🧭
                </span>

                תכנון מסלול

            </button>


        </section>



        <!-- ================================================= -->
        <!-- ROUTE PLANNER -->
        <!-- ================================================= -->

        <section
            id="routePlannerSection"
            class="route-planner hidden"
        >

            <div class="section-heading">

                <div>

                    <h2>
                        תכנון מסלול
                    </h2>

                    <p>
                        בחר נקודת התחלה וסיום
                    </p>

                </div>

            </div>


            <div class="form-group">

                <label for="routeDate">
                    תאריך
                </label>

                <input
                    id="routeDate"
                    type="date"
                >

            </div>


            <div class="form-group">

                <label for="routeStartTime">
                    שעת התחלה
                </label>

                <input
                    id="routeStartTime"
                    type="time"
                >

            </div>


            <div class="form-group">

                <label for="routeStartAddress">
                    כתובת התחלה
                </label>

                <input
                    id="routeStartAddress"
                    type="text"
                    placeholder="לדוגמה: תעשייה אווירית שער מערב"
                >

            </div>


            <div class="form-group">

                <label for="routeEndAddress">
                    כתובת סיום
                </label>

                <input
                    id="routeEndAddress"
                    type="text"
                    placeholder="לדוגמה: אהרון הכהן 4, ראשון לציון"
                >

            </div>


            <button
                id="saveRouteSettingsButton"
                class="route-save-button"
                type="button"
            >
                שמור הגדרות מסלול
            </button>


            <div
                id="routePlannerMessage"
                class="route-message"
            >
            </div>

        </section>



        <!-- ================================================= -->
        <!-- SHIPMENTS -->
        <!-- ================================================= -->

        <section class="shipments-section">


            <div class="section-heading">

                <div>

                    <h2>
                        המשלוחים שלי
                    </h2>

                    <p id="shipmentListSubtitle">
                        כל המשלוחים המשויכים אליך
                    </p>

                </div>


                <span
                    id="shipmentCountBadge"
                    class="shipment-count-badge"
                >
                    0
                </span>

            </div>



            <div
                id="driverShipmentsList"
                class="driver-shipments-list"
            >
            </div>


        </section>



        <!-- ================================================= -->
        <!-- REPORTS -->
        <!-- ================================================= -->

        <section class="reports-section">

            <button
                id="driverReportsButton"
                class="reports-button"
                type="button"
            >

                📊 דוחות והכנסות

            </button>

        </section>


    </div>



    <!-- ===================================================== -->
    <!-- ADD SHIPMENT MODAL -->
    <!-- ===================================================== -->

    <div
        id="addShipmentModal"
        class="modal-overlay hidden"
    >

        <div class="modal-card">


            <div class="modal-header">

                <div>

                    <h2>
                        הוספת משלוח
                    </h2>

                    <p>
                        הזן את פרטי הלקוח והכתובת
                    </p>

                </div>


                <button
                    id="closeAddShipmentModal"
                    class="modal-close-button"
                    type="button"
                >
                    ✕
                </button>

            </div>



            <form id="driverAddShipmentForm">


                <div class="form-group">

                    <label for="driverShipmentCustomer">
                        שם לקוח
                    </label>

                    <input
                        id="driverShipmentCustomer"
                        type="text"
                        placeholder="לדוגמה: ישראל ישראלי"
                    >

                </div>


                <div class="form-group">

                    <label for="driverShipmentPhone">
                        מספר טלפון
                    </label>

                    <input
                        id="driverShipmentPhone"
                        type="tel"
                        inputmode="tel"
                        placeholder="050-1234567"
                    >

                </div>


                <div class="form-group">

                    <label for="driverShipmentCity">
                        עיר
                    </label>

                    <input
                        id="driverShipmentCity"
                        type="text"
                        placeholder="לדוגמה: פתח תקווה"
                        required
                    >

                </div>


                <div class="address-row">


                    <div class="form-group street-field">

                        <label for="driverShipmentStreet">
                            רחוב
                        </label>

                        <input
                            id="driverShipmentStreet"
                            type="text"
                            placeholder="שם הרחוב"
                            required
                        >

                    </div>


                    <div class="form-group house-field">

                        <label for="driverShipmentHouseNumber">
                            מספר
                        </label>

                        <input
                            id="driverShipmentHouseNumber"
                            type="text"
                            placeholder="12"
                            required
                        >

                    </div>


                </div>


                <div class="address-details-row">


                    <div class="form-group">

                        <label for="driverShipmentEntrance">
                            כניסה
                        </label>

                        <input
                            id="driverShipmentEntrance"
                            type="text"
                            placeholder="א"
                        >

                    </div>


                    <div class="form-group">

                        <label for="driverShipmentFloor">
                            קומה
                        </label>

                        <input
                            id="driverShipmentFloor"
                            type="text"
                            placeholder="2"
                        >

                    </div>


                    <div class="form-group">

                        <label for="driverShipmentApartment">
                            דירה
                        </label>

                        <input
                            id="driverShipmentApartment"
                            type="text"
                            placeholder="6"
                        >

                    </div>


                </div>


                <div class="form-group">

                    <label for="driverShipmentNotes">
                        הערות
                    </label>

                    <textarea
                        id="driverShipmentNotes"
                        rows="3"
                        placeholder="לדוגמה: להתקשר לפני הגעה"
                    ></textarea>

                </div>


                <div class="modal-actions">


                    <button
                        id="cancelAddShipmentButton"
                        class="cancel-button"
                        type="button"
                    >
                        ביטול
                    </button>


                    <button
                        class="save-button"
                        type="submit"
                    >
                        הוסף משלוח
                    </button>


                </div>


            </form>


        </div>

    </div>



    <!-- ===================================================== -->
    <!-- DELIVERY DETAILS -->
    <!-- ===================================================== -->

    <div
        id="deliveryDetailsOverlay"
        class="bottom-sheet-overlay hidden"
    >

        <div
            id="deliveryDetailsSheet"
            class="bottom-sheet"
        >


            <div class="bottom-sheet-handle">
            </div>


            <div class="delivery-sheet-header">

                <div>

                    <span
                        id="deliveryShipmentNumber"
                        class="delivery-number"
                    >
                    </span>

                    <h2 id="deliveryCustomerName">
                        לקוח
                    </h2>

                </div>


                <button
                    id="closeDeliveryDetails"
                    class="modal-close-button"
                    type="button"
                >
                    ✕
                </button>

            </div>



            <div class="delivery-info-card">


                <div class="delivery-info-row">

                    <span class="info-label">
                        כתובת
                    </span>

                    <strong id="deliveryAddress">
                    </strong>

                </div>


                <div class="delivery-info-row">

                    <span class="info-label">
                        פרטי בניין
                    </span>

                    <span id="deliveryBuildingDetails">
                    </span>

                </div>


                <div class="delivery-info-row">

                    <span class="info-label">
                        טלפון
                    </span>

                    <a
                        id="deliveryPhone"
                        href="#"
                    >
                    </a>

                </div>


                <div class="delivery-info-row">

                    <span class="info-label">
                        הערות
                    </span>

                    <span id="deliveryNotes">
                    </span>

                </div>


                <div class="delivery-info-row">

                    <span class="info-label">
                        ETA
                    </span>

                    <span id="deliveryEta">
                        עדיין לא חושב
                    </span>

                </div>


            </div>



            <div class="delivery-actions-grid">


                <a
                    id="callCustomerButton"
                    class="delivery-action-button"
                    href="#"
                >
                    📞 התקשר
                </a>


                <button
                    id="openNavigationButton"
                    class="delivery-action-button"
                    type="button"
                >
                    🚗 ניווט
                </button>


            </div>



            <div
                id="navigationOptions"
                class="navigation-options hidden"
            >


                <button
                    id="openWazeButton"
                    type="button"
                >
                    Waze
                </button>


                <button
                    id="openGoogleMapsButton"
                    type="button"
                >
                    Google Maps
                </button>


            </div>



            <div class="delivery-status-actions">


                <button
                    id="markDeliveredButton"
                    class="delivered-button"
                    type="button"
                >
                    ✓ נמסר
                </button>


                <button
                    id="markFailedButton"
                    class="failed-button"
                    type="button"
                >
                    ✕ לא נמסר
                </button>


            </div>


        </div>

    </div>



    <!-- ===================================================== -->
    <!-- SUPABASE -->
    <!-- ===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-config.js"></script>

    <script src="driver.js?v=20261022-2"></script>


</body>

</html>
