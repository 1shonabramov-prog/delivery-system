<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        התחברות | Delivery
    </title>

    <link
        rel="stylesheet"
        href="login.css"
    >

</head>


<body>


    <main class="login-page">


        <section class="login-card">


            <!-- =================================================
                 BRAND
            ================================================== -->

            <div class="login-brand">

                <div class="login-logo">
                    D
                </div>

                <div>

                    <h1>
                        Delivery
                    </h1>

                    <p>
                        מערכת ניהול משלוחים
                    </p>

                </div>

            </div>



            <!-- =================================================
                 TITLE
            ================================================== -->

            <div class="login-title">

                <h2>
                    כניסה למערכת
                </h2>

                <p>
                    הזן אימייל וסיסמה
                </p>

            </div>



            <!-- =================================================
                 LOGIN FORM
            ================================================== -->

            <form
                id="loginForm"
                class="login-form"
            >


                <!-- EMAIL -->

                <div class="login-form-group">

                    <label for="loginEmail">
                        אימייל
                    </label>


                    <div class="login-input-wrapper">

                        <span class="login-input-icon">
                            👤
                        </span>


                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="הכנס אימייל"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>



                <!-- PASSWORD -->

                <div class="login-form-group">

                    <label for="loginPassword">
                        סיסמה
                    </label>


                    <div class="login-input-wrapper">

                        <span class="login-input-icon">
                            🔒
                        </span>


                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="הזן סיסמה"
                            autocomplete="current-password"
                            required
                        >


                        <button
                            type="button"
                            id="togglePasswordButton"
                            class="password-toggle"
                            aria-label="הצג או הסתר סיסמה"
                        >
                            👁️
                        </button>

                    </div>

                </div>



                <!-- REMEMBER -->

                <label class="remember-row">

                    <input
                        type="checkbox"
                        id="rememberUser"
                    >

                    <span>
                        זכור אותי במכשיר הזה
                    </span>

                </label>



                <!-- MESSAGE -->

                <div
                    id="loginMessage"
                    class="login-message hidden"
                >
                </div>



                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-button"
                >
                    כניסה למערכת
                </button>


            </form>



            <!-- =================================================
                 FOOTER
            ================================================== -->

            <div class="login-footer">

                <span>
                    מערכת Delivery
                </span>

                <small>
                    ניהול משלוחים חכם
                </small>

            </div>


        </section>


    </main>


    <!-- =====================================================
         SUPABASE
    ====================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-config.js"></script>

    <script src="login.js?v=20261022-1"></script>


</body>

</html>
