<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        היסטוריה ודוחות - Delivery System
    </title>

    <link
        rel="stylesheet"
        href="driver.css?v=20261028-3"
    >
</head>


<body>

    <div class="driver-app">

        <!-- ============================================== -->
        <!-- HEADER -->
        <!-- ============================================== -->

        <header class="driver-header">

            <div>

                <div
                    style="
                        font-size:12px;
                        color:#94a3b8;
                        margin-bottom:4px;
                    "
                >
                    Delivery System
                </div>

                <h1
                    style="
                        margin:0;
                        font-size:22px;
                    "
                >
                    היסטוריה ודוחות
                </h1>

            </div>


            <button
                id="backToDriverButton"
                type="button"
                class="secondary-action-button"
            >
                חזרה למסך השליח
            </button>

        </header>


        <!-- ============================================== -->
        <!-- DRIVER INFO -->
        <!-- ============================================== -->

        <section
            style="
                margin-top:18px;
                margin-bottom:20px;
            "
        >

            <div
                style="
                    font-size:13px;
                    color:#64748b;
                "
            >
                שליח
            </div>

            <div
                id="historyDriverName"
                style="
                    margin-top:4px;
                    font-size:18px;
                    font-weight:700;
                "
            >
                טוען...
            </div>

        </section>


        <!-- ============================================== -->
        <!-- FILTERS -->
        <!-- ============================================== -->

        <section class="driver-section">

            <div
                style="
                    display:flex;
                    justify-content:space-between;
                    align-items:center;
                    gap:10px;
                    flex-wrap:wrap;
                    margin-bottom:14px;
                "
            >

                <div>

                    <h2
                        style="
                            margin:0;
                            font-size:18px;
                        "
                    >
                        סינון
                    </h2>

                    <div
                        style="
                            margin-top:4px;
                            font-size:13px;
                            color:#64748b;
                        "
                    >
                        בחר תקופה להצגת המשלוחים
                    </div>

                </div>

            </div>


            <div
                style="
                    display:grid;
                    grid-template-columns:repeat(2, minmax(0, 1fr));
                    gap:10px;
                "
            >

                <button
                    id="filterTodayButton"
                    type="button"
                    class="secondary-action-button"
                >
                    היום
                </button>


                <button
                    id="filterYesterdayButton"
                    type="button"
                    class="secondary-action-button"
                >
                    אתמול
                </button>


                <button
                    id="filterLast7DaysButton"
                    type="button"
                    class="secondary-action-button"
                >
                    7 ימים אחרונים
                </button>


                <button
                    id="filterThisMonthButton"
                    type="button"
                    class="secondary-action-button"
                >
                    החודש
                </button>

            </div>


            <div
                style="
                    margin-top:14px;
                    display:grid;
                    grid-template-columns:1fr auto;
                    gap:10px;
                    align-items:end;
                "
            >

                <div>

                    <label
                        for="historyCustomDate"
                        style="
                            display:block;
                            font-size:13px;
                            font-weight:700;
                            margin-bottom:6px;
                        "
                    >
                        תאריך מסוים
                    </label>


                    <input
                        id="historyCustomDate"
                        type="date"
                        style="
                            width:100%;
                            box-sizing:border-box;
                        "
                    >

                </div>


                <button
                    id="filterCustomDateButton"
                    type="button"
                    class="primary-action-button"
                >
                    הצג
                </button>

            </div>


            <div
                id="historyFilterLabel"
                style="
                    margin-top:12px;
                    font-size:13px;
                    color:#64748b;
                "
            >
                מציג: היום
            </div>

        </section>


        <!-- ============================================== -->
        <!-- SUMMARY -->
        <!-- ============================================== -->

        <section
            style="
                margin-top:22px;
            "
        >

            <div
                style="
                    display:grid;
                    grid-template-columns:repeat(2, minmax(0,1fr));
                    gap:12px;
                "
            >

                <div class="driver-stat-card">

                    <div class="driver-stat-label">
                        סה"כ משלוחים
                    </div>

                    <div
                        id="historyTotalCount"
                        class="driver-stat-value"
                    >
                        0
                    </div>

                </div>


                <div class="driver-stat-card">

                    <div class="driver-stat-label">
                        נמסרו
                    </div>

                    <div
                        id="historyDeliveredCount"
                        class="driver-stat-value"
                    >
                        0
                    </div>

                </div>


                <div class="driver-stat-card">

                    <div class="driver-stat-label">
                        לא נמסרו
                    </div>

                    <div
                        id="historyFailedCount"
                        class="driver-stat-value"
                    >
                        0
                    </div>

                </div>


                <div class="driver-stat-card">

                    <div class="driver-stat-label">
                        הכנסה
                    </div>

                    <div
                        id="historyIncome"
                        class="driver-stat-value"
                    >
                        ₪0
                    </div>

                </div>

            </div>

        </section>


        <!-- ============================================== -->
        <!-- HISTORY LIST -->
        <!-- ============================================== -->

        <section
            style="
                margin-top:26px;
                padding-bottom:30px;
            "
        >

            <div
                style="
                    display:flex;
                    justify-content:space-between;
                    align-items:center;
                    margin-bottom:12px;
                "
            >

                <div>

                    <h2
                        style="
                            margin:0;
                            font-size:18px;
                        "
                    >
                        פירוט משלוחים
                    </h2>

                    <div
                        id="historyListSubtitle"
                        style="
                            margin-top:4px;
                            font-size:13px;
                            color:#64748b;
                        "
                    >
                        טוען...
                    </div>

                </div>


                <span
                    id="historyResultCount"
                    style="
                        min-width:34px;
                        height:34px;
                        padding:0 8px;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        border-radius:17px;
                        background:#e2e8f0;
                        font-weight:700;
                    "
                >
                    0
                </span>

            </div>


            <div id="historyShipmentsList">

                <div class="driver-empty-state">
                    טוען היסטוריה...
                </div>

            </div>

        </section>

    </div>


    <!-- ============================================== -->
    <!-- SUPABASE -->
    <!-- ============================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script
        src="supabase-config.js?v=20261028-1"
    ></script>

    <script
        src="driver-history.js?v=20261028-1"
    ></script>

</body>

</html>
